<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AIショート動画メーカー Pro</title>
  <style>
    :root { --bg: #090d16; --card: #1e293b; --accent: #8b5cf6; --text: #f8fafc; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 15px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; }

    /* 9:16 プレーヤー */
    .video-player {
      width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 20px;
      position: relative; overflow: hidden; border: 2px solid #334155;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .bg-image { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.8s ease-in-out; }
    .bg-image.active { opacity: 0.6; }
    
    .caption-box {
      position: absolute; bottom: 80px; left: 20px; right: 20px;
      background: rgba(0, 0, 0, 0.8); padding: 16px; border-radius: 12px;
      font-size: 18px; font-weight: bold; text-align: center; color: #fff;
      border-left: 5px solid var(--accent); line-height: 1.4;
      animation: slideUp 0.5s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* UIエリア */
    input[type="password"], input[type="text"] {
      width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #334155;
      background: var(--card); color: #fff; outline: none; margin-bottom: 8px;
    }
    .btn {
      width: 100%; padding: 16px; background: var(--accent); color: white;
      border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .status-msg { font-size: 11px; color: #94a3b8; text-align: center; height: 1.2em; }
  </style>
</head>
<body>

<div class="container">
  <input type="password" id="apiKey" placeholder="Gemini API Key">
  
  <div class="video-player" id="player">
    <img id="img1" class="bg-image">
    <img id="img2" class="bg-image">
    <div id="caption" class="caption-box" style="display:none;"></div>
  </div>

  <div id="status" class="status-msg"></div>

  <div class="input-box">
    <input type="text" id="topicInput" placeholder="テーマを入力（例：深海の不思議）">
    <button class="btn" id="genBtn" onclick="startGeneration()">🎬 動画を構成・再生</button>
  </div>
</div>

<script>
  let timeline = [];
  let currentStep = 0;
  let isPlaying = false;

  const apiKeyInput = document.getElementById('apiKey');
  apiKeyInput.value = localStorage.getItem('video_maker_key') || '';
  apiKeyInput.addEventListener('change', () => localStorage.setItem('video_maker_key', apiKeyInput.value.trim()));

  async function startGeneration() {
    const apiKey = apiKeyInput.value.trim();
    const topic = document.getElementById('topicInput').value.trim();
    if (!apiKey || !topic) return alert("APIキーとテーマを入力してください");

    const status = document.getElementById('status');
    const genBtn = document.getElementById('genBtn');
    genBtn.disabled = true;
    status.textContent = "AIモデルを探査中...";

    try {
      // 1. モデルリスト取得（執念のロジック）
      const mRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const mData = await mRes.json();
      const models = mData.models.filter(m => m.supportedGenerationMethods.includes("generateContent")).sort((a,b)=>b.name.localeCompare(a.name));
      const model = models.find(m => m.name.includes("flash")) || models[0];

      const prompt = `テーマ「${topic}」で、SNS向けショート動画の台本を作成してください。
以下のJSON形式のみで出力。解説やMarkdownは一切不要。
{"scenes": [{"text": "読み上げる台詞(短く)", "img_prompt": "画像生成用英語(人物、風景など具体的)"}, ... 5シーン分程度]}`;

      status.textContent = `${model.name.split('/').pop()} で台本を生成中...`;

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${model.name}:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { responseMimeType: "application/json" }
        })
      });

      const data = await response.json();
      const result = JSON.parse(data.candidates[0].content.parts[0].text);
      timeline = result.scenes;

      status.textContent = "映像素材を生成・再生します...";
      playVideo();

    } catch (e) {
      alert("エラーが発生しました: " + e.message);
    } finally {
      genBtn.disabled = false;
    }
  }

  async function playVideo() {
    isPlaying = true;
    currentStep = 0;
    const caption = document.getElementById('caption');
    caption.style.display = 'block';

    while (currentStep < timeline.length && isPlaying) {
      const scene = timeline[currentStep];
      
      // 画像の切り替え（クロスフェード演出）
      const imgIds = ['img1', 'img2'];
      const activeImg = document.getElementById(imgIds[currentStep % 2]);
      const inactiveImg = document.getElementById(imgIds[(currentStep + 1) % 2]);

      const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(scene.img_prompt + ", high quality digital art style, cinematic") }?width=540&height=960&nologo=true&seed=${Math.floor(Math.random()*1000)}`;
      
      activeImg.src = imgUrl;
      caption.textContent = scene.text;

      activeImg.classList.add('active');
      inactiveImg.classList.remove('active');

      // 音声読み上げを待機
      await speak(scene.text);
      
      currentStep++;
      if (currentStep < timeline.length) await new Promise(r => setTimeout(r, 500));
    }
    document.getElementById('status').textContent = "再生終了";
  }

  function speak(text) {
    return new Promise(resolve => {
      window.speechSynthesis.cancel();
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'ja-JP';
      uttr.rate = 1.2; // 少し早口でショート動画風
      uttr.pitch = 1.1;
      uttr.onend = resolve;
      window.speechSynthesis.speak(uttr);
    });
  }
</script>
</body>
</html>
