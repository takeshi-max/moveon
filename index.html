<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AIショート動画 Pro Ultra</title>
  <style>
    :root { --bg: #020617; --card: #1e293b; --accent: #8b5cf6; --accent-glow: rgba(139, 92, 246, 0.5); --text: #f8fafc; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom); display: flex; justify-content: center; overflow-x: hidden; }
    .app-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; min-height: 100vh; }

    /* 9:16 プレーヤー */
    .video-player {
      width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 28px;
      position: relative; overflow: hidden; border: 2px solid #334155;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8); cursor: pointer;
    }
    
    /* プログレスバー */
    .progress-container { position: absolute; top: 12px; left: 12px; right: 12px; height: 3px; background: rgba(255,255,255,0.2); border-radius: 10px; z-index: 20; }
    .progress-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 10px; transition: width 0.3s linear; box-shadow: 0 0 10px var(--accent); }

    .bg-image { 
      position: absolute; width: 100%; height: 100%; object-fit: cover; 
      opacity: 0; transition: opacity 1.8s ease-in-out, transform 10s linear;
      transform: scale(1.05);
    }
    .bg-image.active { opacity: 0.7; transform: scale(1.25); }
    
    .caption-box {
      position: absolute; bottom: 80px; left: 16px; right: 16px;
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      padding: 20px; border-radius: 22px;
      font-size: 20px; font-weight: 900; text-align: center; color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      border-left: 6px solid var(--accent); line-height: 1.5;
      z-index: 10; text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      display: none;
      animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* UI操作エリア */
    .controls-panel { transition: all 0.5s ease; max-height: 500px; opacity: 1; overflow: hidden; }
    .controls-panel.hidden { max-height: 0; opacity: 0; pointer-events: none; margin: 0; }

    .controls-card { background: var(--card); border-radius: 24px; padding: 20px; border: 1px solid #334155; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    input, select {
      width: 100%; padding: 16px; border-radius: 14px; border: 1px solid #475569;
      background: #0f172a; color: #fff; outline: none; margin-bottom: 12px; font-size: 15px; transition: border 0.3s;
    }
    input:focus, select:focus { border-color: var(--accent); }

    .btn {
      width: 100%; padding: 20px; background: var(--accent); color: white;
      border: none; border-radius: 16px; font-weight: 800; cursor: pointer; transition: all 0.2s; font-size: 17px;
      box-shadow: 0 6px 0 #6d28d9;
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #6d28d9; }
    
    .status-msg { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 10px; min-height: 1.2em; font-family: monospace; letter-spacing: 1px; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="controls-panel" id="uiPanel">
    <div class="controls-card">
      <input type="password" id="apiKey" placeholder="Google Gemini API Key">
      <input type="text" id="topicInput" placeholder="動画のテーマ（例：深海の巨大生物）">
      
      <select id="styleSelect">
        <option value="photorealistic, cinematic light, 8k resolution, National Geographic style">リアル写真（実写風）</option>
        <option value="anime style, vibrant colors, Makoto Shinkai style, high detailed">アニメ風（映画クオリティ）</option>
        <option value="dark fantasy, oil painting, mysterious, dramatic shadows">油絵・ファンタジー風</option>
        <option value="cyberpunk, neon glow, futuristic city, concept art">サイバーパンク風</option>
      </select>

      <button class="btn" id="genBtn" onclick="startGeneration()">🎬 動画を生成して再生</button>
      <div id="status" class="status-msg">READY</div>
    </div>
  </div>
  
  <div class="video-player" id="player" onclick="togglePause()">
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
    <img id="img1" class="bg-image">
    <img id="img2" class="bg-image">
    <div id="caption" class="caption-box"></div>
  </div>
</div>

<script>
  let timeline = [];
  let isPlaying = false;
  let isPaused = false;
  let audioCtx = null;
  let oscillators = [];

  const apiKeyInput = document.getElementById('apiKey');
  apiKeyInput.value = localStorage.getItem('video_pro_ultra_key') || '';
  apiKeyInput.addEventListener('change', () => localStorage.setItem('video_pro_ultra_key', apiKeyInput.value.trim()));

  function unlockAudio() {
    window.speechSynthesis.cancel();
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  // 🎻 深みのあるアンビエントBGM生成
  function startAmbientBGM() {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    stopBGM(); // 既存停止

    const frequencies = [110, 164.81, 220]; // A2, E3, A3 の和音
    frequencies.forEach(freq => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.02, audioCtx.currentTime + 2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      oscillators.push({osc, gain});
    });
  }

  function stopBGM() {
    oscillators.forEach(obj => {
      obj.gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2);
      setTimeout(() => obj.osc.stop(), 2000);
    });
    oscillators = [];
  }

  function togglePause() {
    if (!isPlaying) return;
    isPaused = !isPaused;
    const status = document.getElementById('status');
    if (isPaused) {
      window.speechSynthesis.pause();
      status.textContent = "PAUSED - TAP TO RESUME";
    } else {
      window.speechSynthesis.resume();
      status.textContent = "RESUMED";
    }
  }

  async function startGeneration() {
    const apiKey = apiKeyInput.value.trim();
    const topic = document.getElementById('topicInput').value.trim();
    if (!apiKey || !topic) return alert("APIキーとテーマを入力してください");

    unlockAudio();
    const status = document.getElementById('status');
    const genBtn = document.getElementById('genBtn');
    const uiPanel = document.getElementById('uiPanel');
    
    genBtn.disabled = true;
    isPaused = false;

    try {
      status.textContent = "SEARCHING BEST MODELS...";
      const mRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const mData = await mRes.json();
      if (!mRes.ok) throw new Error(mData.error?.message || "Invalid API Key");

      let models = mData.models.filter(m => m.supportedGenerationMethods.includes("generateContent")).sort((a,b) => b.name.localeCompare(a.name));
      const lastModel = localStorage.getItem('last_video_model') || models[0].name;

      const prompt = `テーマ「${topic}」で、物語のようなショート動画の台本を作成してください。
必ず以下のJSON形式でのみ出力。
{"scenes": [{"text": "読み上げるセリフ(12文字以内)", "img_prompt": "English visual description for AI image generation, focus on mood"}]}`;

      let success = false;
      for (const m of models) {
        status.textContent = `COMPOSING SCRIPT...`;
        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/${m.name}:generateContent?key=${apiKey}`;
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
          });

          if (response.ok) {
            const data = await response.json();
            const result = JSON.parse(data.candidates[0].content.parts[0].text.match(/\{.*\}/s)[0]);
            timeline = result.scenes;
            localStorage.setItem('last_video_model', m.name);
            success = true; break;
          }
        } catch (e) { continue; }
      }

      if (!success) throw new Error("AI is busy. Retry later.");

      status.textContent = "READY TO START";
      uiPanel.classList.add('hidden'); // UIを隠す
      startAmbientBGM();
      playVideo();

    } catch (e) {
      alert("Error: " + e.message);
      status.textContent = "ERROR";
      genBtn.disabled = false;
    }
  }

  async function playVideo() {
    isPlaying = true;
    let step = 0;
    const caption = document.getElementById('caption');
    const progressBar = document.getElementById('progressBar');
    const stylePrompt = document.getElementById('styleSelect').value;
    caption.style.display = 'block';

    while (step < timeline.length && isPlaying) {
      while (isPaused) await new Promise(r => setTimeout(r, 200));

      const scene = timeline[step];
      const imgIds = ['img1', 'img2'];
      const activeImg = document.getElementById(imgIds[step % 2]);
      const inactiveImg = document.getElementById(imgIds[(step + 1) % 2]);

      activeImg.style.transform = 'scale(1.05)';
      progressBar.style.width = `${((step) / timeline.length) * 100}%`;

      const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(scene.img_prompt + ", " + stylePrompt) }?width=540&height=960&nologo=true&seed=42`; // シードを固定して一貫性を出す

      document.getElementById('status').textContent = `LOADING SCENE ${step + 1}...`;
      
      await new Promise(resolve => {
        activeImg.onload = resolve;
        activeImg.onerror = resolve;
        activeImg.src = imgUrl;
      });

      caption.textContent = scene.text;
      activeImg.classList.add('active');
      inactiveImg.classList.remove('active');

      document.getElementById('status').textContent = `PLAYING (${step + 1}/${timeline.length})`;
      
      await speak(scene.text);
      
      step++;
      if (step < timeline.length) await new Promise(r => setTimeout(r, 500));
    }
    
    progressBar.style.width = '100%';
    stopBGM();
    document.getElementById('status').textContent = "REPLAY READY";
    document.getElementById('uiPanel').classList.remove('hidden'); // UIを再表示
    document.getElementById('genBtn').disabled = false;
    isPlaying = false;
  }

  function speak(text) {
    return new Promise(resolve => {
      window.speechSynthesis.cancel();
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'ja-JP';
      uttr.rate = 1.2; 
      uttr.pitch = 1.0;
      
      let isDone = false;
      const done = () => { if(!isDone){ isDone=true; resolve(); } };
      uttr.onend = done;
      uttr.onerror = done;
      setTimeout(done, 8000); 
      window.speechSynthesis.speak(uttr);
    });
  }
</script>
</body>
</html>
