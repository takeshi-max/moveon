<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Funny Animal Shorts Generator</title>
  <style>
    :root { --bg: #0f172a; --accent: #f59e0b; --accent-glow: #fbbf24; --text: #f8fafc; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: env(safe-area-inset-top) 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    
    .app-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; height: 100vh; max-height: 850px; }

    /* 9:16 ショート動画用ビューポート */
    .video-viewport {
      width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 28px;
      position: relative; overflow: hidden; border: 2px solid rgba(245, 158, 11, 0.3);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
    }

    /* 内部描画Canvas */
    #renderCanvas { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* 進捗バー */
    .progress-container { position: absolute; top: 15px; left: 15px; right: 15px; height: 6px; background: rgba(255,255,255,0.2); border-radius: 10px; z-index: 30; }
    .progress-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 10px; transition: width 0.3s ease; box-shadow: 0 0 10px var(--accent-glow); }

    /* VFXレイヤー */
    .vignette { position: absolute; inset: 0; background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.6) 100%); pointer-events: none; z-index: 10; }

    /* UI操作パネル */
    .controls-panel { transition: all 0.5s ease; z-index: 40; }
    .controls-panel.hidden { opacity: 0; pointer-events: none; transform: translateY(-20px); height: 0; margin: 0; overflow: hidden; }
    .card { background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(16px); border-radius: 24px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); }
    input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 14px; margin-bottom: 10px; outline: none; }
    input:focus { border-color: var(--accent); }
    
    .main-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #f59e0b, #d97706); color: white; border: none; border-radius: 14px; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); transition: transform 0.1s ease; }
    .main-btn:active { transform: scale(0.98); }
    .main-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .download-btn { width: 100%; padding: 14px; background: #10b981; color: white; border: none; border-radius: 14px; font-weight: 800; font-size: 15px; cursor: pointer; display: none; margin-top: 10px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
    
    .status-msg { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 10px; min-height: 1.2em; font-family: monospace; letter-spacing: 0.5px; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="controls-panel" id="uiPanel">
    <div class="card">
      <input type="password" id="apiKey" placeholder="Google Gemini API Key">
      <input type="text" id="topicInput" placeholder="例：キャットタワーから落ちそうになるドジな猫">
      <button class="main-btn" id="genBtn" onclick="startGeneration()">🐾 動物ハプニング動画を作成</button>
      <button class="download-btn" id="downloadBtn" onclick="downloadVideo()">💾 生成された動画を保存</button>
      <div id="status" class="status-msg">READY.</div>
    </div>
  </div>
  
  <div class="video-viewport" id="player">
    <div class="vignette"></div>
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
    <canvas id="renderCanvas" width="720" height="1280"></canvas>
  </div>
</div>

<script>
  let timeline = [];
  let mediaRecorder;
  let recordedChunks = [];
  let recordedBlobUrl = null;
  
  const canvas = document.getElementById('renderCanvas');
  const ctx = canvas.getContext('2d');

  const apiKeyInput = document.getElementById('apiKey');
  apiKeyInput.value = localStorage.getItem('short_video_studio_key') || '';
  apiKeyInput.addEventListener('change', () => localStorage.setItem('short_video_studio_key', apiKeyInput.value.trim()));

  async function startGeneration() {
    const apiKey = apiKeyInput.value.trim();
    const topic = document.getElementById('topicInput').value.trim();
    if (!apiKey || !topic) return alert("API Keyとテーマを入力してください");

    window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));

    const status = document.getElementById('status');
    const genBtn = document.getElementById('genBtn');
    genBtn.disabled = true;

    try {
      status.textContent = "SCANNING MODELS...";
      const mRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const mData = await mRes.json();
      if(!mRes.ok) throw new Error(mData.error?.message || "API Key Error");

      const models = mData.models
        .filter(m => m.supportedGenerationMethods.includes("generateContent") && m.name.includes("gemini"))
        .sort((a,b) => b.name.localeCompare(a.name));

      // ★ 動物ハプニング動画に特化した最適化プロンプト ★
      const prompt = `あなたはShorts/TikTokで大人気な動物ハプニング動画の脚本家です。
テーマ「${topic}」で、視聴者が思わずクスッと笑ってしまうドジな動物の短い動画シナリオ（4シーン）を作成してください。

【構成ルール】
・シーン1: 状況設定（可愛い・気取った姿）
・シーン2: 予兆（狙いを定める・余計な行動）
・シーン3: ハプニング発生（大失敗・ズッコケ）
・シーン4: オチ（とぼけた顔・気まずい表情・心の叫び）

【出力フォーマット】
以下のJSON形式のみを出力してください:
{
  "scenes": [
    {
      "text": "10文字〜18文字程度のツッコミや心の声（例：『余裕だニャ！』『えっ、うそ…！？』）",
      "image_prompt": "funny animal prompt in english, expressive face, awkward position, funny fail moment, highly detailed"
    }
  ]
}`;
      
      let success = false;
      for (const m of models) {
        status.textContent = `COMPOSING FUNNY SCENARIO (${m.name.split('/').pop()})...`;
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${m.name}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });

          const data = await response.json();
          if (response.ok && data.candidates?.[0]?.content) {
            const rawText = data.candidates[0].content.parts[0].text;
            const jsonMatch = rawText.match(/\{[\s\S]*\}/);
            if (jsonMatch) {
              timeline = JSON.parse(jsonMatch[0]).scenes;
              success = true;
              break;
            }
          }
        } catch (e) { continue; }
      }

      if (!success) throw new Error("シナリオ生成に失敗しました。再試行してください。");

      status.textContent = "GENERATING FUNNY IMAGES...";
      await preloadImages();

      document.getElementById('uiPanel').classList.add('hidden');
      await playAndRecordMovie();

    } catch (e) {
      alert("エラー: " + e.message);
      genBtn.disabled = false;
      status.textContent = "ERROR.";
    }
  }

  async function preloadImages() {
    for (let i = 0; i < timeline.length; i++) {
      const scene = timeline[i];
      // 動物の面白い表情やポーズが出やすいようプロンプト修飾語を追加
      const encodedPrompt = encodeURIComponent(`${scene.image_prompt}, funny animal face, viral TikTok video style, funny fail, highly detailed, 9:16 aspect ratio`);
      const imgUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=720&height=1280&nologo=true&seed=${Math.floor(Math.random()*2000)}`;
      
      scene.imgObj = new Image();
      scene.imgObj.crossOrigin = "anonymous";
      scene.imgObj.src = imgUrl;

      await new Promise(resolve => {
        scene.imgObj.onload = resolve;
        scene.imgObj.onerror = resolve;
      });
    }
  }

  async function playAndRecordMovie() {
    const progressBar = document.getElementById('progressBar');
    recordedChunks = [];

    const stream = canvas.captureStream(30);
    const options = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') 
      ? { mimeType: 'video/webm;codecs=vp9' } 
      : { mimeType: 'video/webm' };
      
    mediaRecorder = new MediaRecorder(stream, options);
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.start();

    for (let i = 0; i < timeline.length; i++) {
      const scene = timeline[i];
      progressBar.style.width = `${((i + 1) / timeline.length) * 100}%`;

      let progress = 0;
      let animationFrameId;

      const renderLoop = () => {
        progress += 0.008; // テンポよく進むスピード設定
        const scale = 1.0 + (progress * 0.12);

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 1. AI背景画像（Ken Burns効果）
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.scale(scale, scale);
        if (scene.imgObj && scene.imgObj.complete) {
          ctx.drawImage(scene.imgObj, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
        } else {
          ctx.fillStyle = "#1e293b";
          ctx.fillRect(-canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
        }
        ctx.restore();

        // 2. ★ ポップ＆インパクト重視のテロップ演出 ★
        const boxY = canvas.height * 0.72;
        
        // ポップなイエローバナー背景
        ctx.fillStyle = "#fbbf24";
        ctx.beginPath();
        ctx.roundRect(30, boxY, canvas.width - 60, 160, 20);
        ctx.fill();
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 6;
        ctx.stroke();

        // 太文字ポップ体風フォントと文字装飾
        ctx.font = "900 42px -apple-system, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        
        const text = scene.text;
        const visibleLength = Math.floor(text.length * Math.min(progress * 3.0, 1.0));
        
        // 黒太フチ＋白文字
        ctx.shadowColor = "rgba(0,0,0,0.5)";
        ctx.shadowBlur = 8;
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 8;
        ctx.strokeText(text.substring(0, visibleLength), canvas.width / 2, boxY + 80);
        
        ctx.fillStyle = "#ffffff";
        ctx.fillText(text.substring(0, visibleLength), canvas.width / 2, boxY + 80);

        animationFrameId = requestAnimationFrame(renderLoop);
      };

      renderLoop();

      // 音声読み上げ（少しテンポを上げてコミカルに）
      await new Promise(resolve => {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(scene.text);
        u.lang = 'ja-JP';
        u.rate = 1.2; // テンポ良い口調にするため1.2倍速
        u.pitch = 1.2; // 少し高めのトーンでコミカルさを演出

        let done = false;
        const finish = () => { if (!done) { done = true; resolve(); } };

        u.onend = finish;
        u.onerror = finish;
        window.speechSynthesis.speak(u);

        setTimeout(finish, (scene.text.length * 200) + 1800);
      });

      cancelAnimationFrame(animationFrameId);
    }

    mediaRecorder.stop();
    await new Promise(resolve => mediaRecorder.onstop = resolve);

    const blob = new Blob(recordedChunks, { type: 'video/webm' });
    recordedBlobUrl = URL.createObjectURL(blob);

    document.getElementById('uiPanel').classList.remove('hidden');
    document.getElementById('status').textContent = "FUNNY VIDEO READY!";
    document.getElementById('downloadBtn').style.display = 'block';
    document.getElementById('genBtn').disabled = false;
  }

  function downloadVideo() {
    if (!recordedBlobUrl) return;
    const a = document.createElement('a');
    a.href = recordedBlobUrl;
    a.download = `funny-animal-short-${Date.now()}.webm`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
</script>
</body>
</html>
