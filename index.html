<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AIショート動画 Pro Ultra</title>
  <style>
    :root { --bg: #020617; --card: #1e293b; --accent: #8b5cf6; --text: #f8fafc; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom); display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; min-height: 100vh; }

    .video-player {
      width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 28px;
      position: relative; overflow: hidden; border: 2px solid #334155;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8); cursor: pointer;
    }
    
    .progress-container { position: absolute; top: 12px; left: 12px; right: 12px; height: 3px; background: rgba(255,255,255,0.2); border-radius: 10px; z-index: 20; }
    .progress-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 10px; transition: width 0.3s linear; }

    .bg-image { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.8s ease-in-out, transform 10s linear; transform: scale(1.05); }
    .bg-image.active { opacity: 0.7; transform: scale(1.25); }
    
    .caption-box {
      position: absolute; bottom: 80px; left: 16px; right: 16px;
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px);
      padding: 20px; border-radius: 22px; font-size: 19px; font-weight: 900; text-align: center;
      border: 1px solid rgba(255,255,255,0.15); border-left: 6px solid var(--accent); line-height: 1.5;
      z-index: 10; text-shadow: 0 2px 8px rgba(0,0,0,0.6); display: none;
    }

    .controls-panel { transition: all 0.5s ease; }
    .controls-panel.hidden { max-height: 0; opacity: 0; pointer-events: none; margin: 0; }
    .controls-card { background: var(--card); border-radius: 24px; padding: 20px; border: 1px solid #334155; }
    input, select { width: 100%; padding: 16px; border-radius: 14px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 15px; margin-bottom: 12px; outline: none; }
    .btn { width: 100%; padding: 20px; background: var(--accent); color: white; border: none; border-radius: 16px; font-weight: 800; cursor: pointer; font-size: 17px; box-shadow: 0 6px 0 #6d28d9; }
    .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #6d28d9; }
    .status-msg { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 10px; min-height: 1.2em; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="controls-panel" id="uiPanel">
    <div class="controls-card">
      <input type="password" id="apiKey" placeholder="Gemini API Key">
      <input type="text" id="topicInput" placeholder="動画のテーマ（例：恋人と過ごす理想の休日）">
      <select id="styleSelect">
        <option value="photorealistic, cinematic light, high quality">実写・シネマティック</option>
        <option value="anime style, vibrant colors, soft lighting">アニメ・鮮やか</option>
        <option value="digital art, dreamy, fantasy atmosphere">デジタルアート・幻想的</option>
      </select>
      <button class="btn" id="genBtn" onclick="startGeneration()">🎬 動画を生成</button>
      <div id="status" class="status-msg">READY</div>
    </div>
  </div>
  
  <div class="video-player" id="player" onclick="togglePause()">
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
    <img id="img1" class="bg-image">
    <img id="img2" class="bg-image">
    <div id="caption" class="caption-box"></div>
  </div>
</div>

<script>
  let timeline = [];
  let isPlaying = false;
  let isPaused = false;
  let audioCtx = null;
  let oscillators = [];

  const apiKeyInput = document.getElementById('apiKey');
  apiKeyInput.value = localStorage.getItem('video_pro_ultra_v2_key') || '';
  apiKeyInput.addEventListener('change', () => localStorage.setItem('video_pro_ultra_v2_key', apiKeyInput.value.trim()));

  function unlockAudio() {
    window.speechSynthesis.cancel();
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  async function startGeneration() {
    const apiKey = apiKeyInput.value.trim();
    const topic = document.getElementById('topicInput').value.trim();
    if (!apiKey || !topic) return alert("APIキーとテーマを入力してください");

    unlockAudio();
    const status = document.getElementById('status');
    const genBtn = document.getElementById('genBtn');
    genBtn.disabled = true;

    try {
      // 1. モデルリスト取得
      status.textContent = "Checking models...";
      const mRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const mData = await mRes.json();
      if (!mRes.ok) throw new Error(mData.error?.message || "Invalid API Key");

      const models = mData.models
        .filter(m => m.supportedGenerationMethods.includes("generateContent"))
        .sort((a,b) => b.name.localeCompare(a.name));

      const lastModel = localStorage.getItem('last_video_model_working');
      const targetModels = (lastModel && models.some(m => m.name === lastModel)) ? [{name: lastModel}, ...models.filter(m => m.name !== lastModel)] : models;

      const prompt = `テーマ「${topic}」でショート動画の台本を作成してください。
必ずJSON形式のみで出力。 {"scenes": [{"text": "読み上げるセリフ(12文字以内)", "img_prompt": "English visual description"}]}`;

      let success = false;
      for (const m of targetModels) {
        status.textContent = `Trying ${m.name.split('/').pop()}...`;
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${m.name}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              // 安全フィルターを解除（誤判定防止）
              safetySettings: [
                { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
              ],
              generationConfig: { responseMimeType: "application/json" }
            })
          });

          const data = await response.json();
          // candidatesが存在するかチェック（ここがエラーの場所）
          if (response.ok && data.candidates && data.candidates[0].content) {
            const rawText = data.candidates[0].content.parts[0].text;
            const result = JSON.parse(rawText.match(/\{.*\}/s)[0]);
            timeline = result.scenes;
            localStorage.setItem('last_video_model_working', m.name);
            success = true;
            break;
          }
        } catch (e) { console.warn(m.name + " failed", e); continue; }
      }

      if (!success) throw new Error("Google側の制限、または不適切なテーマと判定されました。別のテーマでお試しください。");

      status.textContent = "GENERATING VISUALS...";
      document.getElementById('uiPanel').classList.add('hidden');
      playVideo();

    } catch (e) {
      alert("Error: " + e.message);
      status.textContent = "ERROR";
      genBtn.disabled = false;
    }
  }

  async function playVideo() {
    isPlaying = true;
    let step = 0;
    const caption = document.getElementById('caption');
    const progressBar = document.getElementById('progressBar');
    const stylePrompt = document.getElementById('styleSelect').value;
    caption.style.display = 'block';

    while (step < timeline.length && isPlaying) {
      while (isPaused) await new Promise(r => setTimeout(r, 200));

      const scene = timeline[step];
      const activeImg = document.getElementById(step % 2 === 0 ? 'img1' : 'img2');
      const inactiveImg = document.getElementById(step % 2 === 0 ? 'img2' : 'img1');

      activeImg.style.transform = 'scale(1.05)';
      progressBar.style.width = `${(step / timeline.length) * 100}%`;

      const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(scene.img_prompt + ", " + stylePrompt)}?width=540&height=960&nologo=true&seed=${Math.floor(Math.random()*1000)}`;

      document.getElementById('status').textContent = `LOADING SCENE ${step + 1}...`;
      await new Promise(resolve => {
        activeImg.onload = resolve;
        activeImg.onerror = resolve;
        activeImg.src = imgUrl;
      });

      caption.textContent = scene.text;
      activeImg.classList.add('active');
      inactiveImg.classList.remove('active');
      document.getElementById('status').textContent = `PLAYING (${step + 1}/${timeline.length})`;
      
      await speak(scene.text);
      step++;
      if (step < timeline.length) await new Promise(r => setTimeout(r, 500));
    }
    
    progressBar.style.width = '100%';
    document.getElementById('status').textContent = "REPLAY READY";
    document.getElementById('uiPanel').classList.remove('hidden');
    document.getElementById('genBtn').disabled = false;
    isPlaying = false;
  }

  function speak(text) {
    return new Promise(resolve => {
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'ja-JP'; uttr.rate = 1.2;
      uttr.onend = resolve;
      uttr.onerror = resolve;
      window.speechSynthesis.speak(uttr);
    });
  }

  function togglePause() {
    if (!isPlaying) return;
    isPaused = !isPaused;
    if (isPaused) window.speechSynthesis.pause();
    else window.speechSynthesis.resume();
  }
</script>
</body>
</html>
