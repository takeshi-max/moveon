<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Video Downloader</title>
  <style>
    body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
    .container { width: 100%; max-width: 400px; }
    .video-box { width: 100%; aspect-ratio: 9/16; background: #000; border-radius: 20px; overflow: hidden; position: relative; border: 2px solid #f59e0b; margin-bottom: 10px; }
    video { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s; }
    video.active { opacity: 1; }
    .subtitle { position: absolute; bottom: 80px; width: 100%; text-align: center; color: white; font-size: 20px; font-weight: 900; text-shadow: 0 2px 10px #000; padding: 0 20px; box-sizing: border-box; z-index: 10; pointer-events: none; }
    input, button { width: 100%; padding: 14px; margin-top: 10px; border-radius: 12px; border: none; font-weight: bold; font-size: 15px; outline: none; }
    input { background: #1e293b; color: white; border: 1px solid #334155; }
    button { background: #f59e0b; color: #000; cursor: pointer; }
    #downloadArea { margin-top: 20px; background: #1e293b; padding: 15px; border-radius: 12px; display: none; }
    .dl-link { display: block; color: #38bdf8; text-decoration: none; margin-bottom: 8px; font-size: 13px; border-bottom: 1px solid #334155; padding-bottom: 4px; }
    #status { font-size: 11px; margin-top: 12px; color: #94a3b8; text-align: center; font-family: monospace; }
  </style>
</head>
<body>

<div class="container">
  <div class="video-box">
    <video id="player" playsinline muted></video>
    <div id="subtitle" class="subtitle"></div>
  </div>

  <input type="password" id="geminiKey" placeholder="Gemini Key">
  <input type="password" id="pexelsKey" placeholder="Pexels Key">
  <input type="text" id="topic" placeholder="例：コーヒーを淹れる朝">
  <button id="startBtn" onclick="startApp()">🎥 動画を構成・素材取得</button>
  <div id="status">READY</div>

  <div id="downloadArea">
    <div style="font-size: 12px; font-weight: bold; margin-bottom: 10px; color: #f59e0b;">⬇️ 素材を個別に保存する</div>
    <div id="links"></div>
    <div style="font-size: 9px; color: #94a3b8; margin-top: 10px;">※iPhoneはリンク長押しで「リンク先のファイルをダウンロード」を選択してください。</div>
  </div>
</div>

<script>
  document.getElementById('geminiKey').value = localStorage.getItem('g_key') || '';
  document.getElementById('pexelsKey').value = localStorage.getItem('p_key') || '';

  async function startApp() {
    const gKey = document.getElementById('geminiKey').value.trim();
    const pKey = document.getElementById('pexelsKey').value.trim();
    const topic = document.getElementById('topic').value.trim();
    const status = document.getElementById('status');

    if (!gKey || !pKey || !topic) return alert("入力を確認してください");
    localStorage.setItem('g_key', gKey);
    localStorage.setItem('p_key', pKey);

    try {
      status.textContent = "AIモデル取得中...";
      const mRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${gKey}`);
      const mData = await mRes.json();
      const models = mData.models.filter(m => m.supportedGenerationMethods.includes("generateContent")).sort((a,b)=>b.name.localeCompare(a.name));
      const targetModel = models.find(m => m.name.includes("flash")) || models[0];

      status.textContent = "台本作成中...";
      const prompt = `テーマ「${topic}」で3シーンの台本を作って。JSONのみ。{"scenes": [{"text": "字幕", "search_keyword": "English keyword"}]}`;
      const gRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/${targetModel.name}:generateContent?key=${gKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
      });
      const gData = await gRes.json();
      const timeline = JSON.parse(gData.candidates[0].content.parts[0].text).scenes;

      status.textContent = "Pexelsから素材を厳選中...";
      const linksDiv = document.getElementById('links');
      linksDiv.innerHTML = '';
      
      for (let i = 0; i < timeline.length; i++) {
        const scene = timeline[i];
        const pRes = await fetch(`https://api.pexels.com/videos/search?query=${encodeURIComponent(scene.search_keyword)}&orientation=portrait&per_page=1`, {
          headers: { Authorization: pKey }
        });
        const pData = await pRes.json();
        
        if (pData.videos?.length > 0) {
          const file = pData.videos[0].video_files.find(f => f.width >= 720) || pData.videos[0].video_files[0];
          scene.videoUrl = file.link;
          
          // ダウンロードリンク作成
          const a = document.createElement('a');
          a.className = 'dl-link';
          a.href = file.link;
          a.download = `scene_${i+1}.mp4`;
          a.target = '_blank';
          a.innerText = `🎬 シーン${i+1}: ${scene.text} (保存)`;
          linksDiv.appendChild(a);
        }
      }

      document.getElementById('downloadArea').style.display = 'block';
      status.textContent = "再生を開始します";
      await playMovie(timeline);

    } catch (e) {
      alert("エラー: " + e.message);
      status.textContent = "ERROR";
    }
  }

  async function playMovie(timeline) {
    const player = document.getElementById('player');
    const subtitle = document.getElementById('subtitle');
    for (let scene of timeline) {
      player.classList.remove('active');
      player.src = scene.videoUrl;
      await new Promise(r => player.oncanplay = r);
      subtitle.textContent = scene.text;
      player.classList.add('active');
      player.play();
      
      // 音声読み上げ
      const u = new SpeechSynthesisUtterance(scene.text);
      u.lang = 'ja-JP';
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
      
      await new Promise(r => setTimeout(r, 5000));
    }
    document.getElementById('status').textContent = "DONE.";
  }
</script>
</body>
</html>
