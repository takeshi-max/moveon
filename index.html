<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funny Animal Video Generator</title>
  <style>
    body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .container { width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; }
    .canvas-box { width: 100%; aspect-ratio: 9/16; background: #000; border-radius: 16px; overflow: hidden; position: relative; border: 2px solid #f59e0b; }
    canvas { width: 100%; height: 100%; display: block; }
    input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; font-weight: bold; box-sizing: border-box; }
    input { background: #1e293b; color: white; border: 1px solid #334155; }
    button { background: #f59e0b; color: white; cursor: pointer; margin-top: 15px; }
    #status { font-size: 12px; margin-top: 10px; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <div class="canvas-box">
    <canvas id="stage" width="720" height="1280"></canvas>
  </div>

  <input type="password" id="geminiKey" placeholder="Gemini API Key">
  <input type="text" id="topic" placeholder="例：プールではしゃいでいる、フレンチブルドッグ">
  <button id="startBtn" onclick="startApp()">🐾 動画を作成</button>
  <div id="status"></div>
</div>

<script>
  let timeline = [];
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');

  async function startApp() {
    const gKey = document.getElementById('geminiKey').value.trim();
    const topic = document.getElementById('topic').value.trim();
    const status = document.getElementById('status');

    if (!gKey || !topic) return alert("API Keyとテーマを入力してください");

    status.textContent = "1/3 台本を作成中...";

    const promptText = `テーマ「${topic}」でショート動画（4シーン）のシナリオを作ってください。
必ず以下のJSON形式のみで出力してください（余計な解説は不要）:
{
  "scenes": [
    {"text": "日本語テロップ", "image_prompt": "english image prompt"}
  ]
}`;

    try {
      // 最新の安定版モデルエンドポイントを使用
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${gKey}`;
      
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }]
        })
      });

      const data = await res.json();

      // ★APIからのエラー応答を検知
      if (data.error) {
        throw new Error(`[APIエラー] Code: ${data.error.code} / Message: ${data.error.message}`);
      }

      if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
        throw new Error("AIから有効な応答が得られませんでした。");
      }

      // レスポンスからテキストを抽出してJSONパース
      let rawText = data.candidates[0].content.parts[0].text;
      rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
      
      const parsedData = JSON.parse(rawText);
      timeline = parsedData.scenes;

      status.textContent = "2/3 画像を生成中...";
      await preloadImages();

      status.textContent = "3/3 動画を生成中...";
      await playMovie();

    } catch (e) {
      alert("エラーが発生しました:\n" + e.message);
      status.textContent = "エラーで停止しました";
      console.error(e);
    }
  }

  async function preloadImages() {
    for (let i = 0; i < timeline.length; i++) {
      const scene = timeline[i];
      const encodedPrompt = encodeURIComponent(`${scene.image_prompt}, funny, 9:16 aspect ratio`);
      const imgUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=720&height=1280&nologo=true&seed=${Math.floor(Math.random()*2000)}`;
      
      scene.imgObj = new Image();
      scene.imgObj.crossOrigin = "anonymous";
      scene.isLoaded = false;

      await new Promise(resolve => {
        scene.imgObj.onload = () => {
          scene.isLoaded = true;
          resolve();
        };
        scene.imgObj.onerror = () => {
          scene.isLoaded = false;
          resolve();
        };
        scene.imgObj.src = imgUrl;
      });
    }
  }

  async function playMovie() {
    for (let scene of timeline) {
      const uttr = new SpeechSynthesisUtterance(scene.text);
      uttr.lang = 'ja-JP';
      uttr.rate = 1.2;

      let isSpeaking = true;
      uttr.onend = () => { isSpeaking = false; };
      uttr.onerror = () => { isSpeaking = false; };

      window.speechSynthesis.speak(uttr);

      const startTime = Date.now();
      
      await new Promise(resolve => {
        function render() {
          const elapsed = (Date.now() - startTime) / 1000;
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (scene.imgObj && scene.isLoaded) {
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            const scale = 1.0 + (elapsed * 0.03);
            ctx.scale(scale, scale);
            ctx.drawImage(scene.imgObj, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
            ctx.restore();
          } else {
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          }

          ctx.fillStyle = "#fbfb04";
          ctx.strokeStyle = "#000000";
          ctx.lineWidth = 8;
          ctx.font = "900 48px sans-serif";
          ctx.textAlign = "center";
          ctx.strokeText(scene.text, canvas.width / 2, canvas.height - 150);
          ctx.fillText(scene.text, canvas.width / 2, canvas.height - 150);

          if (isSpeaking || elapsed < 3) {
            requestAnimationFrame(render);
          } else {
            resolve();
          }
        }
        render();
      });
    }
    document.getElementById('status').textContent = "動画生成完了！";
  }
</script>
</body>
</html>
