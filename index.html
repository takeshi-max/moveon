<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AI Cinematic Video Maker Pro V5</title>
  <style>
    :root { --bg: #020617; --accent: #8b5cf6; --text: #f8fafc; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: env(safe-area-inset-top) 15px; display: flex; justify-content: center; overflow: hidden; }
    .app-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; height: 100vh; }

    /* 9:16 プロ仕様スクリーン */
    .video-viewport {
      width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 36px;
      position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 40px 100px rgba(0,0,0,0.9); cursor: pointer;
    }
    
    /* 映像レイヤー */
    .bg-image { 
      position: absolute; width: 100%; height: 100%; object-fit: cover; 
      opacity: 0; transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1); transform: scale(1.02);
    }
    .bg-image.active { opacity: 0.8; }

    /* 特殊エフェクトレイヤー */
    #particleCanvas { position: absolute; inset: 0; z-index: 10; pointer-events: none; mix-blend-mode: screen; opacity: 0.6; }
    .vignette { position: absolute; inset: 0; background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.9) 100%); pointer-events: none; z-index: 15; }
    .flare-effect { position: absolute; top: 0; left: -150%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); z-index: 20; transform: skewX(-20deg); }
    .flare-anim { animation: flareMove 1.5s ease-in-out forwards; }
    @keyframes flareMove { from { left: -150%; } to { left: 150%; } }

    /* 字幕（シネマテロップ） */
    .caption-box {
      position: absolute; bottom: 12%; left: 10%; right: 10%;
      padding: 20px; text-align: center; color: #fff; z-index: 25;
      font-size: 19px; font-weight: 900; line-height: 1.6;
      text-shadow: 0 2px 20px rgba(0,0,0,1); display: none;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); border-radius: 15px;
    }

    /* UIパネル */
    .controls-panel { transition: 0.5s; max-height: 600px; }
    .controls-panel.hidden { max-height: 0; opacity: 0; pointer-events: none; transform: translateY(-20px); }
    .card { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); border-radius: 28px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); }
    input, select { width: 100%; padding: 16px; border-radius: 14px; border: 1px solid #475569; background: #000; color: white; font-size: 15px; margin-bottom: 10px; outline: none; }
    .main-btn { width: 100%; padding: 18px; background: var(--accent); color: white; border: none; border-radius: 16px; font-weight: 800; font-size: 17px; cursor: pointer; box-shadow: 0 5px 20px rgba(139, 92, 246, 0.5); }
    .status-msg { font-size: 10px; color: #94a3b8; text-align: center; margin-top: 10px; font-family: monospace; letter-spacing: 1px; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="controls-panel" id="uiPanel">
    <div class="card">
      <input type="password" id="apiKey" placeholder="Google Gemini API Key">
      <input type="text" id="topicInput" placeholder="動画のテーマ（例：黄金の古代遺跡）">
      <select id="styleSelect">
        <option value="cinematic photo, photorealistic, 8k, masterpiece, highly detailed">実写映画風</option>
        <option value="gorgeous anime style, makoto shinkai style, breathtaking scenery">アニメ・新海誠風</option>
        <option value="cyberpunk city, neon lighting, futuristic atmosphere">SF・サイバーパンク</option>
      </select>
      <button class="main-btn" id="genBtn" onclick="startGeneration()">🎬 映画レベルの映像を生成</button>
      <div id="status" class="status-msg">READY.</div>
    </div>
  </div>
  
  <div class="video-viewport" id="player" onclick="togglePause()">
    <div class="vignette"></div>
    <div class="flare-effect" id="flare"></div>
    <canvas id="particleCanvas"></canvas>
    <img id="img1" class="bg-image">
    <img id="img2" class="bg-image">
    <div id="caption" class="caption-box"></div>
  </div>
</div>

<script>
  let timeline = [];
  let isPlaying = false;
  let audioCtx = null;
  let bgmGain = null;
  let particles = [];

  const apiKeyInput = document.getElementById('apiKey');
  apiKeyInput.value = localStorage.getItem('video_v5_key') || '';
  apiKeyInput.addEventListener('change', () => localStorage.setItem('video_v5_key', apiKeyInput.value.trim()));

  // ❄️ パーティクルシステムの構築（舞い散る光の粒子）
  function initParticles() {
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    particles = [];
    for(let i=0; i<50; i++){
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 1,
        speed: Math.random() * 0.5 + 0.2,
        opacity: Math.random()
      });
    }
    function animate() {
      ctx.clearRect(0,0,canvas.width, canvas.height);
      particles.forEach(p => {
        p.y -= p.speed;
        if(p.y < 0) p.y = canvas.height;
        ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
      });
      if(isPlaying) requestAnimationFrame(animate);
    }
    animate();
  }

  // 🎻 重厚なアンビエントBGM生成
  function startBGM() {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    bgmGain = audioCtx.createGain();
    bgmGain.gain.setValueAtTime(0, audioCtx.currentTime);
    bgmGain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 4);
    bgmGain.connect(audioCtx.destination);

    [41.20, 82.41, 123.47, 164.81].forEach((f, i) => { // E1, E2, B2, E3
      const osc = audioCtx.createOscillator();
      osc.type = (i === 0) ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(f, audioCtx.currentTime);
      osc.connect(bgmGain);
      osc.start();
    });
  }

  async function startGeneration() {
    const apiKey = apiKeyInput.value.trim();
    const topic = document.getElementById('topicInput').value.trim();
    if (!apiKey || !topic) return alert("入力してください");

    const status = document.getElementById('status');
    document.getElementById('genBtn').disabled = true;
    status.textContent = "DIRECTING...";

    try {
      // 2026年最新モデル探査ロジック
      const mRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const mData = await mRes.json();
      const models = mData.models.filter(m => m.supportedGenerationMethods.includes("generateContent")).sort((a,b) => b.name.localeCompare(a.name));
      const model = models.find(m => m.name.includes("flash")) || models[0];

      const prompt = `テーマ「${topic}」でドラマチックな5シーンのショート動画台本をJSON形式で作って。
{"scenes": [{"text": "短い台詞", "img_prompt": "English visual description"}]}`;

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${model.name}:generateContent?key=${apiKey}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
      });

      const data = await response.json();
      timeline = JSON.parse(data.candidates[0].content.parts[0].text.match(/\{[\s\S]*\}/)[0]).scenes;

      document.getElementById('uiPanel').classList.add('hidden');
      startBGM();
      initParticles();
      playMovie();
    } catch (e) { alert(e.message); document.getElementById('genBtn').disabled = false; }
  }

  async function playMovie() {
    isPlaying = true;
    let step = 0;
    const style = document.getElementById('styleSelect').value;

    while (step < timeline.length && isPlaying) {
      const scene = timeline[step];
      const activeImg = document.getElementById(step % 2 === 0 ? 'img1' : 'img2');
      const inactiveImg = document.getElementById(step % 2 === 0 ? 'img2' : 'img1');

      // 演出：レンズフレア
      const flare = document.getElementById('flare');
      flare.classList.remove('flare-anim');
      void flare.offsetWidth;
      flare.classList.add('flare-anim');

      const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(scene.img_prompt + ", " + style)}?width=540&height=960&nologo=true&seed=${Math.floor(Math.random()*99999)}`;
      
      document.getElementById('status').textContent = `SCENE ${step + 1} RENDER...`;
      await new Promise(r => { activeImg.onload = r; activeImg.src = imgUrl; });

      document.getElementById('caption').textContent = scene.text;
      document.getElementById('caption').style.display = 'block';
      activeImg.style.opacity = 1;
      inactiveImg.style.opacity = 0;

      // 擬似的なカメラワーク：CSSでの動的ズーム
      activeImg.style.transform = "scale(1.2)";
      activeImg.style.transition = "transform 10s linear, opacity 2s ease";

      await speak(scene.text);
      step++;
      await new Promise(r => setTimeout(r, 1000));
    }
    location.reload(); // 再挑戦のためリロード
  }

  function speak(text) {
    return new Promise(resolve => {
      window.speechSynthesis.cancel();
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'ja-JP'; uttr.rate = 0.9; uttr.pitch = 0.8;
      uttr.onend = resolve;
      window.speechSynthesis.speak(uttr);
    });
  }
</script>
</body>
</html>
