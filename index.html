<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AIショート動画 Pro Ultra V4</title>
  <style>
    :root { --bg: #020617; --card: #1e293b; --accent: #8b5cf6; --text: #f8fafc; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: env(safe-area-inset-top) 15px; display: flex; justify-content: center; overflow: hidden; }
    .app-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; min-height: 100vh; }

    /* 9:16 シネマティックスクリーン */
    .video-player {
      width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 32px;
      position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 30px 80px rgba(0,0,0,0.9); cursor: pointer;
    }
    
    /* 映像エフェクト（質感） */
    .vignette { position: absolute; inset: 0; background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.8) 100%); pointer-events: none; z-index: 15; }
    .flare { position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 50%); pointer-events: none; z-index: 16; animation: flare-move 20s infinite linear; }
    @keyframes flare-move { from { transform: rotate(0deg) translate(5%, 5%); } to { transform: rotate(360deg) translate(-5%, -5%); } }

    .progress-container { position: absolute; top: 15px; left: 15px; right: 15px; height: 3px; background: rgba(255,255,255,0.15); border-radius: 10px; z-index: 30; }
    .progress-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 10px; transition: width 0.4s ease; box-shadow: 0 0 10px var(--accent); }

    /* 背景画像レイヤー */
    .bg-image { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 2s ease-in-out; }
    .bg-image.active { opacity: 0.8; }
    
    /* 動的カメラワーク */
    .zoom-in { animation: anim-zoom-in 15s linear forwards; }
    .zoom-out { animation: anim-zoom-out 15s linear forwards; }
    .pan-right { animation: anim-pan-right 15s linear forwards; }
    @keyframes anim-zoom-in { from { transform: scale(1.05); } to { transform: scale(1.3); } }
    @keyframes anim-zoom-out { from { transform: scale(1.3); } to { transform: scale(1.05); } }
    @keyframes anim-pan-right { from { transform: scale(1.2) translateX(-5%); } to { transform: scale(1.2) translateX(5%); } }
    
    /* 字幕（テロップ） */
    .caption-box {
      position: absolute; bottom: 80px; left: 16px; right: 16px;
      background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      padding: 20px; border-radius: 24px; font-size: 19px; font-weight: 900; text-align: center;
      border: 1px solid rgba(255,255,255,0.1); border-bottom: 4px solid var(--accent); line-height: 1.5;
      z-index: 20; text-shadow: 0 2px 10px rgba(0,0,0,0.8); display: none;
      animation: text-pop 0.5s cubic-bezier(0.17, 0.67, 0.83, 0.67);
    }
    @keyframes text-pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* UIパネル */
    .controls-panel { transition: all 0.6s ease; max-height: 600px; }
    .controls-panel.hidden { max-height: 0; opacity: 0; pointer-events: none; transform: translateY(-20px); }
    .controls-card { background: var(--card); border-radius: 28px; padding: 22px; border: 1px solid rgba(255,255,255,0.05); }
    input, select { width: 100%; padding: 16px; border-radius: 14px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 15px; margin-bottom: 12px; outline: none; }
    .btn { width: 100%; padding: 20px; background: var(--accent); color: white; border: none; border-radius: 18px; font-weight: 800; cursor: pointer; font-size: 17px; box-shadow: 0 6px 0 #6d28d9; }
    .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #6d28d9; }
    .status-msg { font-size: 10px; color: #64748b; text-align: center; margin-top: 10px; font-family: monospace; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="controls-panel" id="uiPanel">
    <div class="controls-card">
      <input type="password" id="apiKey" placeholder="Gemini API Key">
      <input type="text" id="topicInput" placeholder="動画のテーマ（例：魔法世界の森）">
      <select id="styleSelect">
        <option value="cinematic photo, photorealistic, 8k, highly detailed, sharp focus">映画・実写風</option>
        <option value="anime style, makoto shinkai style, breathtaking scenery, vibrant colors">アニメ・新海誠風</option>
        <option value="epic fantasy, digital painting, atmospheric, dramatic lighting">ファンタジー・油絵風</option>
      </select>
      <button class="btn" id="genBtn" onclick="startGeneration()">🎬 映像を生成する</button>
      <div id="status" class="status-msg">READY.</div>
    </div>
  </div>
  
  <div class="video-player" id="player" onclick="togglePause()">
    <div class="vignette"></div>
    <div class="flare"></div>
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
    <img id="img1" class="bg-image">
    <img id="img2" class="bg-image">
    <div id="caption" class="caption-box"></div>
  </div>
</div>

<script>
  let timeline = [];
  let isPlaying = false;
  let isPaused = false;
  let audioCtx = null;
  let bgmGain = null;
  let oscillators = [];

  const apiKeyInput = document.getElementById('apiKey');
  apiKeyInput.value = localStorage.getItem('video_final_v4_key') || '';
  apiKeyInput.addEventListener('change', () => localStorage.setItem('video_final_v4_key', apiKeyInput.value.trim()));

  /* モジュレーション付きBGM生成 */
  function startBGM() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      bgmGain = audioCtx.createGain();
      bgmGain.gain.setValueAtTime(0, audioCtx.currentTime);
      bgmGain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 4);
      bgmGain.connect(audioCtx.destination);

      const freqs = [65.41, 130.81, 196.00, 261.63]; // C2, C3, G3, C4
      oscillators = freqs.map((freq, i) => {
        const osc = audioCtx.createOscillator();
        const lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        osc.type = (i === 0) ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        lfo.frequency.value = 0.4; lfoGain.gain.value = 3;
        lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
        lfo.start(); osc.connect(bgmGain); osc.start();
        return {osc, lfo};
      });
    } catch(e) {}
  }

  function stopBGM() {
    if (bgmGain) {
      bgmGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2);
      setTimeout(() => { oscillators.forEach(o => { o.osc.stop(); o.lfo.stop(); }); oscillators = []; }, 2000);
    }
  }

  async function startGeneration() {
    const apiKey = apiKeyInput.value.trim();
    const topic = document.getElementById('topicInput').value.trim();
    if (!apiKey || !topic) return alert("入力が不足しています");
    const status = document.getElementById('status');
    const genBtn = document.getElementById('genBtn');
    genBtn.disabled = true;

    try {
      status.textContent = "SCANNING MODELS...";
      const mRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const mData = await mRes.json();
      const models = mData.models.filter(m => m.supportedGenerationMethods.includes("generateContent")).sort((a,b) => b.name.localeCompare(a.name));
      const model = models.find(m => m.name.includes("flash")) || models[0];

      const prompt = `テーマ「${topic}」でショート動画台本を作成。5シーン。
必ずJSON形式のみ出力。
{"scenes": [{"text": "短い台詞", "img_prompt": "Detailed visual description in English"}]}`;

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${model.name}:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
      });

      const data = await response.json();
      const res = JSON.parse(data.candidates[0].content.parts[0].text.match(/\{[\s\S]*\}/)[0]);
      timeline = res.scenes;

      status.textContent = "FILMING...";
      document.getElementById('uiPanel').classList.add('hidden');
      startBGM();
      playVideo();
    } catch (e) { alert(e.message); genBtn.disabled = false; }
  }

  async function playVideo() {
    isPlaying = true; let step = 0;
    const style = document.getElementById('styleSelect').value;

    while (step < timeline.length && isPlaying) {
      while (isPaused) await new Promise(r => setTimeout(r, 200));

      const scene = timeline[step];
      const activeImg = document.getElementById(step % 2 === 0 ? 'img1' : 'img2');
      const inactiveImg = document.getElementById(step % 2 === 0 ? 'img2' : 'img1');

      const animations = ['zoom-in', 'zoom-out', 'pan-right'];
      activeImg.className = 'bg-image ' + animations[Math.floor(Math.random() * animations.length)];
      inactiveImg.className = 'bg-image';

      document.getElementById('progressBar').style.width = `${((step + 1) / timeline.length) * 100}%`;
      const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(scene.img_prompt + ", " + style)}?width=540&height=960&nologo=true&seed=${Math.floor(Math.random()*99999)}`;

      document.getElementById('status').textContent = `SCENE ${step + 1} LOADING...`;
      await new Promise(resolve => { activeImg.onload = resolve; activeImg.onerror = resolve; activeImg.src = imgUrl; });

      document.getElementById('caption').textContent = scene.text;
      document.getElementById('caption').style.display = 'block';
      activeImg.classList.add('active');
      inactiveImg.classList.remove('active');

      await speak(scene.text);
      step++;
      if (step < timeline.length) await new Promise(r => setTimeout(r, 1000));
    }
    stopBGM();
    document.getElementById('status').textContent = "FINISH";
    document.getElementById('uiPanel').classList.remove('hidden');
    document.getElementById('genBtn').disabled = false;
    isPlaying = false;
  }

  function speak(text) {
    return new Promise(resolve => {
      window.speechSynthesis.cancel();
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'ja-JP'; uttr.rate = 1.0; uttr.pitch = 0.9;
      uttr.onend = resolve;
      window.speechSynthesis.speak(uttr);
      setTimeout(resolve, 8000); 
    });
  }

  function togglePause() {
    if (!isPlaying) return;
    isPaused = !isPaused;
    if (isPaused) window.speechSynthesis.pause();
    else window.speechSynthesis.resume();
  }
</script>
</body>
</html>
