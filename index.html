<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Funny Animal Video Generator</title>
  <style>
    body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .container { width: 100%; max-width: 400px; padding: 20px; }
    .video-viewport { width: 100%; aspect-ratio: 9/16; background: #000; border-radius: 20px; position: relative; overflow: hidden; border: 2px solid #f59e0b; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .caption-box { position: absolute; bottom: 80px; left: 20px; right: 20px; background: rgba(251, 191, 36, 0.95); padding: 15px; border-radius: 12px; border: 3px solid #000; text-align: center; }
    .caption-text { color: #000; font-weight: 900; font-size: 22px; }
    input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; font-weight: bold; }
    button { background: #f59e0b; color: white; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <div class="video-viewport">
    <video id="mainVideo" playsinline muted></video>
    <div class="caption-box" id="captionBox" style="display:none;">
      <div class="caption-text" id="captionText"></div>
    </div>
  </div>

  <input type="password" id="geminiKey" placeholder="Gemini API Key">
  <input type="text" id="pexelsKey" placeholder="Pexels API Key (無料取得可)">
  <input type="text" id="topic" placeholder="例：おやつに飛びつくドジな犬">
  <button onclick="startApp()">🐾 本物の動画ムービーを作成</button>
  <div id="status" style="font-size: 12px; margin-top: 8px; color: #aaa; text-align: center;"></div>
</div>

<script>
  let timeline = [];

  async function startApp() {
    const gKey = document.getElementById('geminiKey').value.trim();
    const pKey = document.getElementById('pexelsKey').value.trim();
    const topic = document.getElementById('topic').value.trim();
    const status = document.getElementById('status');

    if (!gKey || !topic) return alert("Gemini API Keyとテーマを入力してください");

    status.textContent = "1/3 シナリオ構成中...";

    // 1. Geminiでシナリオと動画検索用英語キーワードを作成
    const prompt = `テーマ「${topic}」で面白い動物ハプニング動画（4シーン）のシナリオを作って。
JSONのみ出力:
{
  "scenes": [
    {"text": "日本語テロップ", "search_query": "funny dog fail"}
  ]
}`;

    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${gKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { responseMimeType: "application/json" }
        })
      });
      const data = await res.json();
      timeline = JSON.parse(data.candidates[0].content.parts[0].text).scenes;

      // 2. 動画素材（MP4）を検索・取得
      status.textContent = "2/3 本物の動画素材(MP4)を検索中...";
      for (let scene of timeline) {
        scene.videoUrl = await fetchRealVideo(scene.search_query, pKey);
      }

      // 3. 動画再生開始
      status.textContent = "3/3 ムービー再生中！";
      playMovie();

    } catch (e) {
      alert("エラー: " + e.message);
    }
  }

  // Pexels API等から本物の縦型MP4動画URLを取得
  async function fetchRealVideo(query, pexelsKey) {
    if (!pexelsKey) {
      // Pexels Keyがない場合のサンプルバックアップ動画
      return "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";
    }
    try {
      const res = await fetch(`https://api.pexels.com/videos/search?query=${encodeURIComponent(query)}&orientation=portrait&per_page=1`, {
        headers: { Authorization: pexelsKey }
      });
      const data = await res.json();
      return data.videos[0].video_files[0].link; // MP4直リンク
    } catch (e) {
      return "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4";
    }
  }

  async function playMovie() {
    const video = document.getElementById('mainVideo');
    const captionBox = document.getElementById('captionBox');
    const captionText = document.getElementById('captionText');

    captionBox.style.display = 'block';

    for (let scene of timeline) {
      video.src = scene.videoUrl;
      captionText.textContent = scene.text;
      
      await video.play();

      // 音声読み上げ
      await new Promise(resolve => {
        const u = new SpeechSynthesisUtterance(scene.text);
        u.lang = 'ja-JP';
        u.rate = 1.2;
        u.onend = resolve;
        u.onerror = resolve;
        window.speechSynthesis.speak(u);
        setTimeout(resolve, 4000); // 4秒制限
      });
    }
    captionBox.style.display = 'none';
    document.getElementById('status').textContent = "再生完了！";
  }
</script>
</body>
</html>
