<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AI MP4 Cinematic Video Player</title>
  <style>
    :root { --bg: #020617; --accent: #8b5cf6; --text: #f8fafc; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: env(safe-area-inset-top) 15px; display: flex; justify-content: center; overflow: hidden; }
    .app-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; height: 100vh; }
    .video-viewport { width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 36px; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 40px 100px rgba(0,0,0,0.9); }
    
    /* 動画タグ設定 */
    #mp4Video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0; transition: opacity 0.8s ease; }
    #mp4Video.active { opacity: 1; }

    .vignette { position: absolute; inset: 0; background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.8) 100%); pointer-events: none; z-index: 15; }
    .caption-box { position: absolute; bottom: 10%; left: 8%; right: 8%; padding: 16px; text-align: center; color: #fff; z-index: 25; font-size: 16px; font-weight: 800; line-height: 1.5; text-shadow: 0 2px 20px rgba(0,0,0,1); display: none; background: rgba(10, 10, 25, 0.65); backdrop-filter: blur(10px); border-radius: 16px; border-left: 4px solid var(--accent); }
    .progress-container { position: absolute; top: 15px; left: 15px; right: 15px; height: 3px; background: rgba(255,255,255,0.15); border-radius: 10px; z-index: 30; }
    .progress-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 10px; transition: width 0.4s ease; }
    .controls-panel { transition: 0.5s; }
    .card { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px); border-radius: 28px; padding: 20px; border: 1px solid rgba(255,255,255,0.08); }
    .main-btn { width: 100%; padding: 18px; background: var(--accent); color: white; border: none; border-radius: 16px; font-weight: 800; font-size: 17px; cursor: pointer; box-shadow: 0 5px 20px rgba(139, 92, 246, 0.5); }
  </style>
</head>
<body>
<div class="app-container">
  <div class="controls-panel" id="uiPanel">
    <div class="card">
      <button class="main-btn" id="genBtn" onclick="playMovieSequence()">🎬 本格AI動画（MP4）を再生</button>
    </div>
  </div>
  <div class="video-viewport" id="player">
    <div class="vignette"></div>
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
    
    <!-- HTML5 Video タグ -->
    <video id="mp4Video" playsinline muted preload="auto"></video>
    
    <div id="caption" class="caption-box"></div>
  </div>
</div>

<script>
  // 外部サービス（Hailuo / Luma / Runway）等で生成したMP4ファイルURL群をセット
  const videoTimeline = [
    {
      videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", 
      text: "近未来の都市に舞い降りた、静けさと希望の光。"
    },
    {
      videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4", 
      text: "広大な世界が、新たなストーリーの幕開けを告げる。"
    }
  ];

  async function playMovieSequence() {
    const video = document.getElementById('mp4Video');
    const caption = document.getElementById('caption');
    const progressBar = document.getElementById('progressBar');
    
    document.getElementById('uiPanel').style.display = 'none';

    for (let i = 0; i < videoTimeline.length; i++) {
      const scene = videoTimeline[i];
      
      // プログレスバーの更新
      progressBar.style.width = `${((i + 1) / videoTimeline.length) * 100}%`;

      // 動画ソースのセットとロード
      video.src = scene.videoUrl;
      video.load();
      
      // キャプション更新
      caption.textContent = scene.text;
      caption.style.display = 'block';

      // 動画再生
      video.classList.add('active');
      await video.play().catch(e => console.log("Autoplay check:", e));

      // 音声読み上げと動画再生の同期をとるPromise
      await new Promise(resolve => {
        let ttsFinished = false;
        let videoFinished = false;

        const checkEnd = () => {
          if (ttsFinished && videoFinished) resolve();
        };

        // ナレーション（TTS）
        const u = new SpeechSynthesisUtterance(scene.text);
        u.lang = 'ja-JP';
        u.onend = () => { ttsFinished = true; checkEnd(); };
        window.speechSynthesis.speak(u);

        // 動画ループまたは再生完了の検出
        video.onended = () => { videoFinished = true; checkEnd(); };

        // フォールバック（最長8秒で強制次シーンへ）
        setTimeout(() => { resolve(); }, 8000);
      });

      video.classList.remove('active');
      await new Promise(r => setTimeout(r, 400)); // シーン間のトランジション
    }

    location.reload(); // 再生完了後にリセット
  }
</script>
</body>
</html>
